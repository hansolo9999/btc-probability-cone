<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTC Probability Cone</title>
<style>
  body {
    background: #1a1a1a;
    color: #e0e0e0;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    margin: 0;
    padding: 16px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 18px; font-weight: 600; margin: 8px 0 4px; }
  .updated { color: #888; font-size: 12px; margin-bottom: 16px; }
  img { width: 100%; border-radius: 8px; display: block; }
  .stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-top: 16px;
  }
  .card {
    background: #242424;
    border-radius: 8px;
    padding: 10px 12px;
  }
  .card .label { color: #888; font-size: 11px; text-transform: uppercase; }
  .card .value { font-size: 16px; font-weight: 600; margin-top: 2px; }
  .p-up { color: #f5a623; }
  .loading { color: #888; padding: 40px 0; text-align: center; }

  .signal {
    margin-top: 12px;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    text-align: center;
    transition: background 0.3s;
  }
  .signal.up   { background: rgba(46, 204, 113, 0.15); color: #2ecc71; border: 1px solid rgba(46, 204, 113, 0.4); }
  .signal.down { background: rgba(231, 76, 60, 0.15); color: #e74c3c; border: 1px solid rgba(231, 76, 60, 0.4); }
  .signal.flat { background: rgba(136, 136, 136, 0.1); color: #888; border: 1px solid rgba(136, 136, 136, 0.25); }

  h1.up   { color: #2ecc71; }
  h1.down { color: #e74c3c; }

  .section-title {
    font-size: 13px;
    color: #888;
    text-transform: uppercase;
    margin: 24px 0 8px;
    letter-spacing: 0.5px;
  }
  .volume-card {
    background: #242424;
    border-radius: 8px;
    padding: 12px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .volume-card.spike { border: 1px solid rgba(245, 166, 35, 0.5); background: rgba(245, 166, 35, 0.08); }
  .liq-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .liq-table th { color: #888; font-weight: 500; text-align: right; padding: 6px 8px; font-size: 11px; text-transform: uppercase; }
  .liq-table th:first-child, .liq-table td:first-child { text-align: left; }
  .liq-table td { padding: 6px 8px; text-align: right; background: #242424; }
  .liq-table tr:first-child td { border-radius: 8px 8px 0 0; }
  .liq-table tr:last-child td { border-radius: 0 0 8px 8px; }
  .liq-long { color: #2ecc71; }
  .liq-short { color: #e74c3c; }
  .futures-note { color: #666; font-size: 11px; margin-top: 6px; }
  .trade-row {
    display: flex;
    justify-content: space-between;
    background: #242424;
    padding: 8px 12px;
    border-radius: 6px;
    margin-bottom: 4px;
    font-size: 13px;
  }
  .trade-row.buy .trade-side { color: #2ecc71; }
  .trade-row.sell .trade-side { color: #e74c3c; }
  .empty-note { color: #666; font-size: 13px; padding: 12px; text-align: center; }

  .news-event {
    background: #242424;
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .news-event-header {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    margin-bottom: 6px;
  }
  .news-event-move.up { color: #2ecc71; font-weight: 600; }
  .news-event-move.down { color: #e74c3c; font-weight: 600; }
  .news-headline {
    display: block;
    color: #a8c7ff;
    font-size: 12px;
    text-decoration: none;
    padding: 3px 0;
  }
  .news-headline .src { color: #666; }

  .paper-stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }
  .paper-position {
    background: #242424;
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
  }
  .paper-position.long { border-left: 3px solid #2ecc71; }
  .paper-position.short { border-left: 3px solid #e74c3c; }
  .paper-trade-row {
    display: flex;
    justify-content: space-between;
    background: #242424;
    padding: 7px 12px;
    border-radius: 6px;
    margin-bottom: 4px;
    font-size: 12px;
  }
  .paper-trade-row .pnl-pos { color: #2ecc71; font-weight: 600; }
  .paper-trade-row .pnl-neg { color: #e74c3c; font-weight: 600; }
  .paper-disclaimer { color: #666; font-size: 11px; margin-top: 6px; line-height: 1.5; }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">BTC-USDT — Probability Cone</h1>
  <div class="updated" id="updated">загрузка...</div>
  <div class="signal flat" id="signal" style="display:none;"></div>
  <img src="btc_probability_cone.png" alt="probability cone">
  <div class="stats" id="stats">
    <div class="loading">считаю...</div>
  </div>

  <div class="section-title">Бумажная торговля (виртуальный счёт, без реальных денег)</div>
  <img src="paper_trading_equity.png" alt="paper trading equity" style="margin-bottom:8px;" onerror="this.style.display='none'">
  <div class="paper-stats" id="paper-stats-section"><div class="empty-note">загрузка...</div></div>
  <div id="paper-position-section"></div>
  <div id="paper-trades-section"></div>

  <div class="section-title">Объём</div>
  <div id="volume-section"><div class="empty-note">загрузка...</div></div>

  <div class="section-title">Зоны ликвидации (оценка)</div>
  <div id="liq-section"><div class="empty-note">загрузка...</div></div>

  <div class="section-title">Крупные сделки (последние ~100)</div>
  <div id="trades-section"><div class="empty-note">загрузка...</div></div>

  <div class="section-title">Новости у резких движений</div>
  <div id="news-section"><div class="empty-note">загрузка...</div></div>
</div>

<script>
fetch('btc_probability_cone.json?t=' + Date.now())
  .then(r => r.json())
  .then(d => {
    document.getElementById('updated').textContent =
      'Обновлено: ' + new Date(d.updated_at).toLocaleString('ru-RU');

    const title = document.getElementById('title');
    const signal = document.getElementById('signal');
    const pUp = d.p_up_pct;

    if (pUp >= 65) {
      title.className = 'up';
      signal.className = 'signal up';
      signal.textContent = `▲ Модель склоняется к росту: ${pUp}%`;
      signal.style.display = 'block';
    } else if (pUp <= 35) {
      title.className = 'down';
      signal.className = 'signal down';
      signal.textContent = `▼ Модель склоняется к падению: ${pUp}%`;
      signal.style.display = 'block';
    } else {
      title.className = '';
      signal.className = 'signal flat';
      signal.textContent = `Нет выраженного сигнала (${pUp}%) — рынок в неопределённости`;
      signal.style.display = 'block';
    }

    const p = d.percentiles;
    document.getElementById('stats').innerHTML = `
      <div class="card"><div class="label">Цена сейчас</div><div class="value">${d.last_price}</div></div>
      <div class="card"><div class="label">P(рост, ${d.forecast_bars}д)</div><div class="value p-up">${d.p_up_pct}%</div></div>
      <div class="card"><div class="label">Медиана прогноза</div><div class="value">${p.p50}</div></div>
      <div class="card"><div class="label">Режим (HMM)</div><div class="value">${d.regime_state}</div></div>
      <div class="card"><div class="label">90% диапазон</div><div class="value">${p.p5} — ${p.p95}</div></div>
      <div class="card"><div class="label">50% диапазон</div><div class="value">${p.p25} — ${p.p75}</div></div>
    `;

    // --- Бумажная торговля ---
    const pt = d.paper_trading;
    const ptStats = document.getElementById('paper-stats-section');
    const ptPos = document.getElementById('paper-position-section');
    const ptTrades = document.getElementById('paper-trades-section');
    if (pt) {
      const retColor = pt.total_return_pct >= 0 ? '#2ecc71' : '#e74c3c';
      ptStats.innerHTML = `
        <div class="card"><div class="label">Баланс</div><div class="value">$${pt.balance.toLocaleString()}</div></div>
        <div class="card"><div class="label">Доходность</div><div class="value" style="color:${retColor}">${pt.total_return_pct > 0 ? '+' : ''}${pt.total_return_pct}%</div></div>
        <div class="card"><div class="label">Сделок закрыто</div><div class="value">${pt.total_trades}</div></div>
        <div class="card"><div class="label">Win rate</div><div class="value">${pt.win_rate !== null ? pt.win_rate + '%' : '—'}</div></div>
      `;
      if (pt.position) {
        const pos = pt.position;
        ptPos.innerHTML = `
          <div class="paper-position ${pos.side}">
            <span>${pos.side === 'long' ? '▲ LONG' : '▼ SHORT'} открыт по ${pos.entry_price}</span>
            <span>TP ${pos.tp} / SL ${pos.sl}</span>
          </div>
        `;
      } else {
        ptPos.innerHTML = '<div class="empty-note">сейчас вне рынка, ждёт сигнала ≥65% или ≤35%</div>';
      }
      ptTrades.innerHTML = `<div class="paper-disclaimer">Виртуальный счёт, старт $10,000. Вход по сигналу модели (не гарантия прибыли), выход по TP=4 ATR / SL=1 ATR.</div>`;
    } else {
      ptStats.innerHTML = '<div class="empty-note">данные ещё не сгенерированы</div>';
    }

    // --- Объём ---
    const v = d.volume;
    const volSection = document.getElementById('volume-section');
    if (v) {
      volSection.innerHTML = `
        <div class="volume-card ${v.is_spike ? 'spike' : ''}">
          <div>
            <div class="label">Текущий / средний (${'20д'})</div>
            <div class="value">${v.current_volume} / ${v.avg_volume}</div>
          </div>
          <div style="text-align:right">
            <div class="label">Z-score</div>
            <div class="value" style="color:${v.is_spike ? '#f5a623' : '#e0e0e0'}">${v.z_score}${v.is_spike ? ' ⚡' : ''}</div>
          </div>
        </div>
      `;
    } else {
      volSection.innerHTML = '<div class="empty-note">данные недоступны</div>';
    }

    // --- Зоны ликвидации ---
    const liqSection = document.getElementById('liq-section');
    if (d.liquidation_zones && d.liquidation_zones.length) {
      let rows = d.liquidation_zones.map(z => `
        <tr>
          <td>${z.leverage}x</td>
          <td class="liq-long">${z.long_liq}</td>
          <td class="liq-short">${z.short_liq}</td>
        </tr>
      `).join('');
      let futuresNote = '';
      if (d.futures) {
        futuresNote = `<div class="futures-note">Binance Futures OI: ${d.futures.open_interest_btc} BTC · funding: ${d.futures.funding_rate_pct}%</div>`;
      } else {
        futuresNote = `<div class="futures-note">Binance Futures данные недоступны в этом запуске</div>`;
      }
      liqSection.innerHTML = `
        <table class="liq-table">
          <tr><th>Плечо</th><th>Long ликв.</th><th>Short ликв.</th></tr>
          ${rows}
        </table>
        ${futuresNote}
        <div class="futures-note">Оценка «если открыть позицию сейчас», не карта реальных чужих стопов</div>
      `;
    } else {
      liqSection.innerHTML = '<div class="empty-note">данные недоступны</div>';
    }

    // --- Крупные сделки ---
    const tradesSection = document.getElementById('trades-section');
    if (d.large_trades && d.large_trades.length) {
      tradesSection.innerHTML = d.large_trades.map(t => `
        <div class="trade-row ${t.side}">
          <span class="trade-side">${t.side === 'buy' ? '▲ BUY' : '▼ SELL'}</span>
          <span>${t.size.toFixed(4)} BTC</span>
          <span>@ ${t.price}</span>
        </div>
      `).join('');
    } else {
      tradesSection.innerHTML = '<div class="empty-note">крупных сделок в последнем окне не найдено</div>';
    }

    // --- Новости у резких движений ---
    const newsSection = document.getElementById('news-section');
    if (d.news_events && d.news_events.length) {
      newsSection.innerHTML = d.news_events.map(ev => {
        const moveClass = ev.move_pct > 0 ? 'up' : 'down';
        const arrow = ev.move_pct > 0 ? '▲' : '▼';
        const dateStr = new Date(ev.date).toLocaleDateString('ru-RU');
        const headlines = (ev.news && ev.news.length)
          ? ev.news.map(n => `<a class="news-headline" href="${n.url}" target="_blank">${n.title} <span class="src">— ${n.source}</span></a>`).join('')
          : '<div class="empty-note" style="padding:4px 0">новости не найдены</div>';
        return `
          <div class="news-event">
            <div class="news-event-header">
              <span>${dateStr} · цена ${ev.price}</span>
              <span class="news-event-move ${moveClass}">${arrow} ${ev.move_pct > 0 ? '+' : ''}${ev.move_pct}%</span>
            </div>
            ${headlines}
          </div>
        `;
      }).join('');
    } else {
      newsSection.innerHTML = '<div class="empty-note">резких движений в последние 30 дней не найдено</div>';
    }
  })
  .catch(() => {
    document.getElementById('stats').innerHTML = '<div class="loading">данные ещё не сгенерированы</div>';
    document.getElementById('paper-stats-section').innerHTML = '';
    document.getElementById('paper-position-section').innerHTML = '';
    document.getElementById('paper-trades-section').innerHTML = '';
    document.getElementById('volume-section').innerHTML = '';
    document.getElementById('liq-section').innerHTML = '';
    document.getElementById('trades-section').innerHTML = '';
    document.getElementById('news-section').innerHTML = '';
  });
</script>
</body>
</html>
